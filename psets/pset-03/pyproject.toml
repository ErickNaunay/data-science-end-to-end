# Entorno local del PSet 3 (EDA, features, modelos y MLflow). Proyecto uv independiente:
# solo lee la OBT del PSet 2 por SELECT; no instala dbt, Spark ni Kestra.
#
# Uso, desde psets/pset-03:
#   uv sync                          crea .venv con Python 3.11 y estas versiones exactas
#   uv run python -m pytest tests
#
# requirements.txt (imagen runner y artefacto que se registra en MLflow) NO se edita a mano:
#   bash exportar_requirements.sh
[project]
name = "pset-03-modelado"
version = "0.1.0"
description = "PSet 3: exploracion, features, modelos entrenados y trackeados con MLflow sobre la OBT"
requires-python = "==3.11.*"
dependencies = [
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "pyarrow>=17",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.9,<4",
    "snowflake-connector-python>=3.12,<6",
    "python-dotenv>=1,<2",
    "mlflow==3.18.0",
    "nbformat>=5,<6",
    "nbclient>=0.10,<1",
    "ipykernel>=6,<8",
    "scipy>=1.11,<2",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false
